# Extra icons for tmux-nerd-font-window-name (merged over the plugin defaults)
config:
  # Claude Code runs as a binary named after its version (e.g. 2.1.34), so
  # version-like process names get the Claude icon
  sem-version-icon: "󰚩"

icons:
  ssh: "󰒍"
  mosh: "󰒍"
  mosh-client: "󰒍"
  claude: "󰚩"
  docker: "󰡨"
  devcontainer: "󰡨"
  docker-compose: "󰡨"
  bluetui: "󰂯"
  bluetoothctl: "󰂯"
  nmtui: "󰖩"
  wiremix: "󰕾"
  timew: "󰅐"
  zathura: "󰈦"
  xdg-open: "󰏌"
  open: "󰏌"

icons-regex:
  (^|/)docker( |$): "󰡨"
  node.*claude: "󰚩"
  (^|/)claude( |$): "󰚩"

names-regex:
  (^|/)docker( |$): docker
  node.*claude: Claude
  (^|/)claude( |$): Claude
