################################################################################
# Plugins (TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm)
# Install plugins with: prefix + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'laktak/extrakto'

# fingers uses prefix+F, so tmux-fzf goes on prefix+C-f
set -g @fingers-key F
set -g @fingers-hint-style "bg=#d8a657,fg=#282828,bold"
set -g @fingers-highlight-style "fg=#89b482"
set-environment -g TMUX_FZF_LAUNCH_KEY "C-f"
set -g @menus_trigger '/'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

################################################################################
# General
set -g default-shell /bin/zsh
set -sg escape-time 0
set -g focus-events on
set -g extended-keys on
set -g mouse on
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g set-clipboard on
# tmux-yank: wl-copy on Wayland (needs the wl-clipboard package), mouse selection to the clipboard
set -g @yank_selection_mouse 'clipboard'
set -g history-limit 50000
set -g mode-keys vi
set -g status-interval 5
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on

# Terminal / truecolor
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g allow-passthrough all   # Yazi image preview

# Notifications
setw -g monitor-activity on
set -g visual-activity on
set -g monitor-bell on

################################################################################
# Colors: gruvbox-material (dark, hard)
bg0='#1d2021'
bg1='#282828'
bg2='#3c3836'
bg3='#504945'
fg='#d4be98'
grey='#928374'
red='#ea6962'
yellow='#d8a657'
aqua='#89b482'
purple='#d3869b'

set -g clock-mode-colour $yellow
set -g message-style "bg=$purple,fg=$bg1,bold"
set -g message-command-style "bg=$purple,fg=$bg1,bold"
set -g pane-border-lines heavy
set -g pane-border-style "fg=$grey"
set -g pane-active-border-style "fg=$yellow"
set -g mode-style "bg=$bg3,fg=$yellow"
setw -g window-status-activity-style "fg=$aqua"
setw -g window-status-bell-style "fg=$red,bold"

################################################################################
# Bar
set -g status-position top
set -g status-justify left
set -g status-style "bg=$bg0,fg=$fg"

set -g status-left-length 80
set -g status-left "#[bg=$yellow,fg=$bg1,bold] #S #[bg=$bg2,fg=$fg] #H #[default] "
# @vimode is the zsh vi mode of the active pane (set from ~/.zshrc)
set -g status-right-length 120
set -g status-right "#{?#{==:#{@vimode},NORMAL},#[bg=$yellow fg=$bg1 bold] NORMAL #[default] ,}#{?#{==:#{@vimode},INSERT},#[bg=$bg3 fg=$fg] INSERT #[default] ,}#{?#{==:#{@vimode},VISUAL},#[bg=$purple fg=$bg1 bold] VISUAL #[default] ,}#{?#{==:#{@vimode},REPLACE},#[bg=$red fg=$bg1 bold] REPLACE #[default] ,}#{?@zen,#[bg=$purple fg=$bg1 bold] ZEN #[default] ,}#{?client_prefix,#[bg=$aqua fg=$bg1 bold] PREFIX #[default] ,}#{?pane_in_mode,#[bg=$yellow fg=$bg1 bold] COPY #[default] ,}#[bg=$bg2 fg=$fg] #{online_status}  #{cpu_percentage} #{?@has_battery,#{battery_color_charge_fg}#{battery_icon_charge}#{battery_icon_status} #{battery_percentage} #[fg=$fg],}#[default] #[fg=$grey]#{b:pane_current_path} #[bg=$bg2,fg=$fg] %a %d %b  %H:%M "

setw -g window-status-format "#{?window_activity_flag,#[fg=$aqua],#{?window_bell_flag,#[fg=$red bold],#[fg=$grey]}} #I:#W#{?window_activity_flag, ●,}#{?window_bell_flag, ,} "
setw -g window-status-current-format "#[bg=$bg3,fg=$yellow,bold] #I:#W#{?window_zoomed_flag,*Z,} "

################################################################################
# Keys
bind r source-file ~/.tmux.conf \; display "Config recargada"

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move between panes (vim-tmux-navigator maps Ctrl-hjkl too)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# New panes/windows in the same path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Copy mode (vi)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

################################################################################
# Zen mode: prefix+z centers a single pane between two empty side panes
set -g @zen-width 150
bind z run-shell '~/.tmux/zen.sh'
bind Z resize-pane -Z   # zoom moved here from prefix+z

################################################################################
# Nested tmux sessions: F12 toggles outer tmux off
bind -T root F12 \
    set prefix None \; \
    set key-table off \; \
    set status-style "bg=$red,fg=$bg0" \; \
    refresh-client -S

bind -T off F12 \
    set -u prefix \; \
    set -u key-table \; \
    set status-style "bg=$bg0,fg=$fg" \; \
    refresh-client -S

################################################################################
# Mostrar batería solo si el equipo tiene una (Linux o macOS)
if-shell 'ls /sys/class/power_supply/BAT* >/dev/null 2>&1 || pmset -g batt 2>/dev/null | grep -q InternalBattery' 'set -g @has_battery 1'

# Battery colour by charge level (normal, yellow under 35%, red under 20%)
set -g @batt_color_charge_primary_tier8 '#d4be98'
set -g @batt_color_charge_secondary_tier8 '#3c3836'
set -g @batt_color_charge_primary_tier7 '#d4be98'
set -g @batt_color_charge_secondary_tier7 '#3c3836'
set -g @batt_color_charge_primary_tier6 '#d4be98'
set -g @batt_color_charge_secondary_tier6 '#3c3836'
set -g @batt_color_charge_primary_tier5 '#d4be98'
set -g @batt_color_charge_secondary_tier5 '#3c3836'
set -g @batt_color_charge_primary_tier4 '#d4be98'
set -g @batt_color_charge_secondary_tier4 '#3c3836'
set -g @batt_color_charge_primary_tier3 '#d8a657'
set -g @batt_color_charge_secondary_tier3 '#3c3836'
set -g @batt_color_charge_primary_tier2 '#ea6962'
set -g @batt_color_charge_secondary_tier2 '#3c3836'
set -g @batt_color_charge_primary_tier1 '#ea6962'
set -g @batt_color_charge_secondary_tier1 '#3c3836'

# Battery icons (Nerd Font): charge level + status
set -g @batt_icon_charge_tier8 ''
set -g @batt_icon_charge_tier7 ''
set -g @batt_icon_charge_tier6 ''
set -g @batt_icon_charge_tier5 ''
set -g @batt_icon_charge_tier4 ''
set -g @batt_icon_charge_tier3 ''
set -g @batt_icon_charge_tier2 ''
set -g @batt_icon_charge_tier1 ''
set -g @batt_icon_status_charging ''
set -g @batt_icon_status_charged ''
set -g @batt_icon_status_attached ''
set -g @batt_icon_status_discharging ''
set -g @batt_icon_status_unknown ''

run '~/.tmux/plugins/tpm/tpm'
