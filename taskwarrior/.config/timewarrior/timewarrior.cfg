# Timewarrior. The on-modify.timewarrior task hook drives it from `task start/stop`.
# Calls from the hook and from taskwarrior-tui shortcuts must stay silent and never prompt.
verbose = off
confirmation = off


# Tag colours, matching the Gruvbox palette of the task theme (see colors/palette.sh)
define theme:
  description: gruvbox
  colors:
    exclusion: "gray8 on gray4"
    today: "bold black on yellow"
    holiday: "black on red"
    label: "gray12"
    odd: "on gray4"
    even: "on gray6"

# Colour of the tag by project / tag, same as color.project.* and color.tag.* in the task theme
tags.work.color = cyan
tags.home.color = green
tags.next.color = bold yellow

# Hours that do not count as tracked time; uncomment and adjust
# define exclusions:
#   monday = <8:00 12:00-13:00 >18:00
