##################################################
# Window rules
##################################################
# Dashboard and cheat sheet: big floating pop-ups on every workspace
for_window [app_id="sway-(dashboard|cheatsheet)"] floating enable, sticky enable, resize set width 85 ppt height 85 ppt, move position center

# Keep the screen awake while a window is fullscreen (not for the pop-ups above)
#for_window [class=".*"] inhibit_idle fullscreen
for_window [app_id="^(?!sway-(dashboard|cheatsheet)$).*"] inhibit_idle fullscreen

# Picture-in-Picture
# for_window [class="chromium" title="Picture-in-Picture"] floating enable, sticky enable
# for_window [class="google-chrome" title="Picture-in-Picture"] floating enable, sticky enable
#for_window [app_id="org.keepassxc.KeePassXC"] floating enable, sticky enable, resize set width 800 height 600
for_window [app_id="firefox" title="Library"] floating enable, sticky enable, resize set width 640 height 360
for_window [app_id="firefox" title="Picture-in-Picture"] floating enable, sticky enable, resize set width 800 height 400
for_window [app_id="thunderbird" title="(Write|New Event|Edit Event).*"] floating enable, resize set width 1000 height 950
# Thunar: rename and file-operation dialogs
for_window [app_id="thunar" title="^((Renombrar|Rename).*|.*Operation.*)$"] floating enable, resize set width 600 height 150
