##################################################
# Keyboard
##################################################
input "type:keyboard" {
  xkb_layout "us,es"
  xkb_options "grp:alt_shift_toggle"
}

input "type:touchpad" {
  tap disabled # Disable click-on-tap
  natural_scroll disabled
  # No touchpad if i am typing
  dwt enabled
  dwtp enabled
}

# ThinkPad only: on other machines the identifier does not exist and is ignored
input "2:10:TPPS/2_Elan_TrackPoint" {
  # Slowdown the trackpoint
  pointer_accel -0.4
}
