##################################################
# SwayIdle
##################################################
# Lock after 5 minutes, screen off after 10 (back on at the first input),
# suspend after 20 only on battery (see idle-suspend.sh).
# The post-unlock network script is run by lock.sh (swaylock does not trigger
# swayidle's "unlock" event)
exec {
  swayidle -w \
    timeout 300 '$lock' \
    timeout 600 '$scripts/display.sh off' \
      resume '$scripts/display.sh on' \
    timeout 1200 '$scripts/idle-suspend.sh' \
    before-sleep '$lock'
}

##################################################
# Apps to execute at the init
##################################################

# Helper daemons (kanshi, mako, wob, dim) are systemd user units bound to
# sway-session.target (see start-systemd-session.sh)

# Turn bluetooth off (only if bluez-utils is installed)
exec command -v bluetoothctl >/dev/null && bluetoothctl power off

# Microphone LED (only if the machine has one)
exec $scripts/mic.sh sync

# Theme (once at startup, not on every reload)
exec {
  gsettings set org.gnome.desktop.interface color-scheme prefer-light
  gsettings set org.gnome.desktop.interface icon-theme "Adwaita"
  gsettings set org.gnome.desktop.interface font-name "Lilex Nerd Font 11"
}

# Wifi (if the script exists)
exec [ -x $net ] && $net

# Border colour by layout (tabbed/stacked); exec_always so a reload restores
# it after sway resets client.focused (the script replaces older instances)
exec_always $scripts/layout-border.py
