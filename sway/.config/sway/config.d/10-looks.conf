##################################################
# Looks
##################################################
# A bit of gap between windows
#gaps inner 5
gaps inner 5
gaps outer 5

# Thin coloured border instead of title bars (tabbed/stacked layouts still
# show titles); no border at all on a lone window
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart

# The indicator colour marks the edge of the focused window where the next
# window will open (right edge = splith, bottom edge = splitv)
# border background text indicator child_border
client.focused          $c_yellow $c_yellow $c_bg $c_aqua_b $c_yellow
client.focused_inactive $c_bg4    $c_bg3    $c_fg $c_bg4    $c_bg4
client.unfocused        $c_bg_h   $c_bg1    $c_gray $c_bg_h $c_bg_h
client.urgent           $c_red    $c_red    $c_fg $c_red    $c_red
client.placeholder      $c_bg     $c_bg     $c_fg $c_bg     $c_bg

# Font
font pango:"Lilex Nerd Font" Regular 11

# Background configuration
#output * bg $c_bg_h solid_color
output * bg /usr/share/images/desktop-base/desktop-background fill

# Focus only changes with the keyboard; the pointer jumps to the focused
# container when the focus moves to another output
focus_follows_mouse no
mouse_warping container

# Same workspace key twice goes back to the previous workspace
workspace_auto_back_and_forth yes
