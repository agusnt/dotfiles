##################################################
# Key bindings
##################################################

# ------------------------------------------------
# Movement:
# ------------------------------------------------

# Alt tab for workspaces
bindsym $mod+tab workspace next_on_output
bindsym $mod+Shift+tab workspace prev_on_output

# Left-Right-Up-Down
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

# Move the focused window with the same, but add Shift
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

# Move between displays
bindsym $mod+Ctrl+$right move workspace to output right
bindsym $mod+Ctrl+$left move workspace to output left
bindsym $mod+Ctrl+$up move workspace to output up
bindsym $mod+Ctrl+$down move workspace to output down

# Change normal to inverse to use left mouse button for resizing and right
# mouse button for dragging.
floating_modifier $mod normal

# ------------------------------------------------
# Scratchpad
# ------------------------------------------------
# Move to scratchpad
bindsym $mod+Shift+z move scratchpad
# Toggle Scratchpad
bindsym $mod+z scratchpad show

# ------------------------------------------------
# For Laptop:
# ------------------------------------------------

# --locked: these also work while the screen is locked.
# Keys the machine does not have are simply never pressed.

# Volume
bindsym --locked XF86AudioRaiseVolume exec $scripts/vol.sh up
bindsym --locked XF86AudioLowerVolume exec $scripts/vol.sh down
bindsym --locked XF86AudioMute exec $scripts/vol.sh mute
bindsym --locked XF86AudioMicMute exec $scripts/mic.sh

# Media
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous

# Bright
bindsym --locked XF86MonBrightnessUp exec $scripts/bright.sh up
bindsym --locked XF86MonBrightnessDown exec $scripts/bright.sh down

# Screenshot
bindsym XF86SelectiveScreenshot exec $scripts/screenshot.sh slurp
bindsym Print exec $scripts/screenshot.sh
bindsym Shift+Print exec $scripts/screenshot.sh slurp

# Display
bindsym XF86Display exec $scripts/mirror.sh

# ------------------------------------------------
# Lid switch (--reload re-evaluates the current state on config reload)
# ------------------------------------------------
bindswitch --reload --locked lid:on exec $scripts/lid.sh close
bindswitch --reload --locked lid:off exec $scripts/lid.sh open

# ------------------------------------------------
# Dashboard (system, backups, tasks, weather): toggled with the same key
# ------------------------------------------------
bindsym $mod+i exec $dashboard toggle

# ------------------------------------------------
# Cheat sheet (sway and Neovim key bindings)
# ------------------------------------------------
# ThinkPad Copilot key: it sends Super+Shift+F23 (check with `wev`)
bindsym $mod+w exec $cheatsheet toggle

# Same cheat sheet on keyboards without the Copilot key
bindsym $mod+F1 exec $cheatsheet toggle

# ------------------------------------------------
# How do I split a new window:
# ------------------------------------------------
bindsym $mod+b splith
bindsym $mod+v splitv

# ------------------------------------------------
# Change between layouts:
# ------------------------------------------------
bindsym $mod+e layout splith
# Stacking: only the focused window (switches the container in place if already tabbed/stacked)
bindsym $mod+s exec $scripts/set-layout.py stacking
# Tabbed: only the focused window (switches the container in place if already tabbed/stacked)
bindsym $mod+t exec $scripts/set-layout.py tabbed
# Nested stacking: always a new container inside the current one
bindsym $mod+Shift+s splitv; layout stacking
# Nested tabbed: always a new container inside the current one
bindsym $mod+Shift+t splitv; layout tabbed

# ------------------------------------------------
# Change the focus
# ------------------------------------------------
bindsym $mod+space focus parent

# ------------------------------------------------
# Floating window
# ------------------------------------------------
bindsym $mod+Shift+space floating toggle; resize set width 98ppt; resize set height 98ppt; move position center

# ------------------------------------------------
# Change Window aspect
# ------------------------------------------------
bindsym $mod+r mode "resize"
bindsym $mod+f fullscreen toggle

# ------------------------------------------------
# APP configuration
# ------------------------------------------------
# Start a terminal
bindsym $mod+Return exec $term
# Kill focused window
bindsym $mod+Shift+q kill
# Start your launcher
bindsym $mod+d exec $menu
# Reload the configuration file
bindsym $mod+c reload
# Mirror laptop screen to monitor
#bindsym $mod+m exec $scripts/mirror.sh
# bindcode 455 = KEY_LINK_PHONE (evdev code 447+8); does nothing if the keyboard lacks it
bindcode 455 exec $scripts/mirror.sh
# Screenshots
bindsym $mod+Ctrl+p exec $scripts/screenshot.sh
bindsym $mod+Shift+p exec $scripts/screenshot.sh slurp
# Lock sway
bindsym $mod+o exec $lock
# Files
bindsym $mod+n exec $files
# Exit sway
#bindsym $mod+Shift+e exit
# Password manager
bindsym $mod+p exec $pass
# Connect wifi (was "release Super", which also fired after every Super+<key>)
bindsym $mod+Shift+n exec $net

##################################################
# Workspaces
##################################################
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

##################################################
# Resizing containers:
##################################################
mode "resize" {
    # left will shrink the containers width
    # right will grow the containers width
    # up will shrink the containers height
    # down will grow the containers height
    # Hold Shift for bigger steps; arrow keys work too
    bindsym $left resize shrink width 20px
    bindsym $right resize grow width 20px
    bindsym $down resize grow height 20px
    bindsym $up resize shrink height 20px
    bindsym Left resize shrink width 20px
    bindsym Right resize grow width 20px
    bindsym Down resize grow height 20px
    bindsym Up resize shrink height 20px

    bindsym Shift+$left resize shrink width 100px
    bindsym Shift+$right resize grow width 100px
    bindsym Shift+$down resize grow height 100px
    bindsym Shift+$up resize shrink height 100px
    bindsym Shift+Left resize shrink width 100px
    bindsym Shift+Right resize grow width 100px
    bindsym Shift+Down resize grow height 100px
    bindsym Shift+Up resize shrink height 100px

    # Return to default mode
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
