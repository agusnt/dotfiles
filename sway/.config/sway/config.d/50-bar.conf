##################################################
# Bar
##################################################

bar {
  output *
  #position top
  font "Lilex Nerd Font Mono 14"
  binding_mode_indicator yes
  # More room around the status blocks
  status_padding 2
  status_edge_padding 12
  mode hide
  wrap_scroll no
  tray_output none

  status_command $bar

  colors {
    background $c_bg

    statusline $c_fg

    focused_workspace  $c_bg_h $c_yellow $c_bg_h
    inactive_workspace  $c_bg_h $c_bg1 $c_fg
  }
}
